version: '3.8'

services:
  db:
    image: mysql:8.0
    container_name: b2b_mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASS:-root_password}
      MYSQL_DATABASE: ${DB_NAME:-b2b_nexus}
      MYSQL_USER: ${DB_USER:-b2b_user}
      MYSQL_PASSWORD: ${DB_PASS:-b2b_password}
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin" ,"ping", "-h", "localhost"]
      timeout: 10s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: b2b_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  minio:
    image: minio/minio
    container_name: b2b_minio
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      - MINIO_ROOT_USER=minioadmin
      - MINIO_ROOT_PASSWORD=minioadmin
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data

  mailpit:
    image: axllent/mailpit
    container_name: b2b_mailpit
    ports:
      - "8025:8025"
      - "1025:1025"
    environment:
      - MP_MAX_MESSAGES=5000

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: b2b_backend
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - DB_HOST=db
      - DB_USER=${DB_USER:-b2b_user}
      - DB_PASS=${DB_PASS:-b2b_password}
      - DB_NAME=${DB_NAME:-b2b_nexus}
      - JWT_SECRET=${JWT_SECRET:-super_secret_jwt_key_override_in_prod}
      - REDIS_URL=redis://redis:6379
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - AWS_ACCESS_KEY_ID=minioadmin
      - AWS_SECRET_ACCESS_KEY=minioadmin
      - AWS_REGION=us-east-1
      - S3_ENDPOINT=http://minio:9000
      - S3_BUCKET=b2b-documents
      - SMTP_HOST=mailpit
      - SMTP_PORT=1025
      - SMTP_USER=
      - SMTP_PASS=
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: b2b_frontend
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  db_data:
  redis_data:
  minio_data:
