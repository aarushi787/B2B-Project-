name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build, type-check, unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Backend
        working-directory: backend
        run: |
          npm ci
          npm test        # compiles with tsc, then runs the node:test suite
          npm audit --omit=dev --audit-level=critical

      - name: Frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build   # tsc -b && vite build
          npm audit --omit=dev --audit-level=critical

      - name: Admin frontend
        working-directory: admin-frontend
        run: |
          npm ci
          npm run build

  e2e:
    name: End-to-end (Playwright)
    runs-on: ubuntu-latest
    needs: build-and-test
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: ci_root_password
          MYSQL_DATABASE: b2b_e2e
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -pci_root_password"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    env:
      # A throwaway database that exists only for this job. Never put real credentials in this file.
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_USER: root
      DB_PASSWORD: ci_root_password
      DB_NAME: b2b_e2e
      JWT_SECRET: ci-only-jwt-secret-not-used-anywhere-else
      DATA_ENCRYPTION_KEY: ci-only-encryption-key-not-used-anywhere-else
      CORS_ORIGIN: http://localhost:5173
      NODE_ENV: test
      PORT: 5000
      AUTH_RATE_LIMIT_MAX: 10000
      E2E_BASE_URL: http://localhost:5173
      E2E_API_URL: http://localhost:5000/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build and start the backend
        working-directory: backend
        run: |
          npm ci
          npm run build
          npm run db:init
          nohup node dist/index.js > ../backend.log 2>&1 &
          for i in $(seq 1 30); do
            curl -sf http://localhost:5000/api/ready && exit 0
            sleep 2
          done
          echo "Backend did not become ready"; cat ../backend.log; exit 1

      - name: Install frontend and browsers
        working-directory: frontend
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Start the frontend
        working-directory: frontend
        run: |
          nohup npm run dev -- --port 5173 --strictPort > ../frontend.log 2>&1 &
          for i in $(seq 1 30); do
            curl -sf http://localhost:5173 >/dev/null && exit 0
            sleep 2
          done
          echo "Frontend did not start"; cat ../frontend.log; exit 1

      - name: Run Playwright
        working-directory: frontend
        run: npx playwright test

      - name: Upload report and server logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-artifacts
          path: |
            frontend/playwright-report
            frontend/test-results
            backend.log
            frontend.log
          if-no-files-found: ignore
